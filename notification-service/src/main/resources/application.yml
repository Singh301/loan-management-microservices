server:
  shutdown: graceful
  port: 8086

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  transaction:
    default-timeout: ${DB_TRANSACTION_TIMEOUT:30s}
  application:
    name: notification-service
  datasource:
    hikari:
      minimum-idle: ${DB_MIN_IDLE:1}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD_MS:0}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        retries: 10
    consumer:
      observation-enabled: true
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.loanmanagement.common.event"
        spring.json.value.default.type: "com.loanmanagement.common.event.DomainEvent"
        isolation.level: read_committed
        max.poll.records: 25
        max.poll.interval.ms: 300000
        session.timeout.ms: 15000
        heartbeat.interval.ms: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

management:
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING_PROBABILITY:0.10}
    propagation:
      type: w3c
  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
