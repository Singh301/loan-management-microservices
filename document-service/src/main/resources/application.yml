server:
  shutdown: graceful
  port: 8085

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  transaction:
    default-timeout: ${DB_TRANSACTION_TIMEOUT:30s}
  application:
    name: document-service
  datasource:
    hikari:
      minimum-idle: ${DB_MIN_IDLE:1}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD_MS:0}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/document_db?createDatabaseIfNotExist=true&useSSL=${DB_SSL:false}&requireSSL=${DB_SSL:false}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

document:
  storage:
    type: ${DOCUMENT_STORAGE_TYPE:local}
    local:
      upload-dir: ${UPLOAD_DIR:./uploads}
    s3:
      bucket: ${DOCUMENT_S3_BUCKET:}
      region: ${DOCUMENT_S3_REGION:ap-south-1}
      key-prefix: ${DOCUMENT_S3_KEY_PREFIX:documents/}
      endpoint: ${DOCUMENT_S3_ENDPOINT:}
      path-style-access: ${DOCUMENT_S3_PATH_STYLE_ACCESS:false}


management:
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING_PROBABILITY:0.10}
    propagation:
      type: w3c
  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
