name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test, and quality gates
        run: mvn -B clean verify -Pquality,integration-tests -DskipTests=false

  docker-publish:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application JARs
        run: mvn -B clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker images
        run: |
          set -e

          services=(
            api-gateway
            audit-service
            auth-service
            customer-service
            dashboard-service
            discovery-server
            document-service
            loan-service
            notification-service
            repayment-service
          )

          for service in "${services[@]}"; do
            echo "Building and pushing ${service}:1.0.0"
            docker build \
              -t "ghcr.io/singh301/${service}:1.0.0" \
              -f "${service}/Dockerfile" \
              .

            docker push "ghcr.io/singh301/${service}:1.0.0"
          done
