server:
  port: 8088

spring:
  application:
    name: dashboard-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:ThisIsAVerySecureSecretKeyForJwtTokenGenerationMinimum256BitsLong!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
