apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: loan-management
spec:
  replicas: 1
  selector:
    matchLabels: { app: zookeeper }
  template:
    metadata:
      labels: { app: zookeeper }
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          env:
            - { name: ZOOKEEPER_CLIENT_PORT, value: "2181" }
            - { name: ZOOKEEPER_TICK_TIME, value: "2000" }
          ports:
            - { containerPort: 2181 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: loan-management
spec:
  selector: { app: zookeeper }
  ports:
    - { name: client, port: 2181, targetPort: 2181 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: loan-management
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          env:
            - { name: KAFKA_BROKER_ID, value: "1" }
            - { name: KAFKA_ZOOKEEPER_CONNECT, value: zookeeper:2181 }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:29092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
          ports:
            - { containerPort: 29092 }
          readinessProbe:
            tcpSocket: { port: 29092 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket: { port: 29092 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 700m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: loan-management
spec:
  selector: { app: kafka }
  ports:
    - { name: broker, port: 29092, targetPort: 29092 }
