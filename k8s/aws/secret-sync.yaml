apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-sync
  namespace: loan-management
spec:
  replicas: 1
  selector:
    matchLabels: { app: secret-sync }
  template:
    metadata:
      labels: { app: secret-sync }
    spec:
      serviceAccountName: loan-management-secrets
      automountServiceAccountToken: true
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sync
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["/bin/sh", "-c", "sleep 2147483647"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          volumeMounts:
            - name: app-secret-store
              mountPath: /mnt/app-secrets
              readOnly: true
      volumes:
        - name: app-secret-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: app-secret
