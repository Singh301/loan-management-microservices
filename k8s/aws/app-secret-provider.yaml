apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: app-secret
  namespace: loan-management
spec:
  provider: aws
  secretObjects:
    - secretName: loan-management-secrets
      type: Opaque
      data:
        - objectName: DB_USERNAME
          key: DB_USERNAME
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
        - objectName: JWT_SECRET
          key: JWT_SECRET
  parameters:
    usePodIdentity: "true"
    region: "ap-south-1"
    objects: |
      - objectName: "loan-management-app-secrets"
        objectType: "secretsmanager"
        jmesPath:
          - path: DB_USERNAME
            objectAlias: DB_USERNAME
          - path: DB_PASSWORD
            objectAlias: DB_PASSWORD
          - path: JWT_SECRET
            objectAlias: JWT_SECRET
