apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-management-config
  namespace: loan-management
data:
  # Replace these placeholders with managed AWS endpoints.
  DB_HOST: REPLACE_WITH_RDS_ENDPOINT
  DB_PORT: "3306"
  DB_SSL: "true"
  DB_ALLOW_PUBLIC_KEY_RETRIEVAL: "false"
  REDIS_HOST: REPLACE_WITH_ELASTICACHE_ENDPOINT
  REDIS_PORT: "6379"
  REDIS_SSL: "true"
  KAFKA_BOOTSTRAP: REPLACE_WITH_MSK_BOOTSTRAP_SERVERS
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: PLAIN
  KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
  DOCUMENT_STORAGE_TYPE: s3
  DOCUMENT_S3_REGION: ap-south-1
  DOCUMENT_S3_KEY_PREFIX: documents/
  DOCUMENT_S3_PATH_STYLE_ACCESS: "false"
