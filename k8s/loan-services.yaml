      containers:
        - name: repayment-service
          image: ghcr.io/singh301/repayment-service:latest
          ports: [{ containerPort: 8084 }]
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=20.0 -XX:+ExitOnOutOfMemoryError"
          envFrom:
