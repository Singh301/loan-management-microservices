apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-management-config
  namespace: loan-management
data:
  EUREKA_URL: http://discovery-server:8761/eureka/
  DB_HOST: mysql
  DB_PORT: "3306"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP: kafka:29092
  DOCUMENT_STORAGE_TYPE: local
  DOCUMENT_S3_REGION: ap-south-1
  DOCUMENT_S3_KEY_PREFIX: documents/
  DOCUMENT_S3_PATH_STYLE_ACCESS: "false"
