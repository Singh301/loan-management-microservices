apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: loan-management
spec:
  replicas: 2
  selector:
    matchLabels: { app: document-service }
  template:
    metadata:
      labels: { app: document-service }
    spec:
      containers:
        - name: document-service
          image: ghcr.io/singh301/document-service:latest
          ports: [{ containerPort: 8085 }]
          env:
            - name: UPLOAD_DIR
