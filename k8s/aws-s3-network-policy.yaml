# AWS production overlay: allow document-service to reach S3 over TLS.
# Prefer an S3 VPC endpoint so traffic remains inside the AWS network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-document-s3-https
  namespace: loan-management
spec:
  podSelector:
    matchLabels:
      app: document-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
